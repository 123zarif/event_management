services:
  postgres:
    image: postgres:16-alpine
    container_name: clubsphere-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clubsphere}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clubsphere_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-clubsphere_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clubsphere} -d ${POSTGRES_DB:-clubsphere_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: clubsphere-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clubsphere-web
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://${POSTGRES_USER:-clubsphere}:${POSTGRES_PASSWORD:-clubsphere_secure_password}@postgres:5432/${POSTGRES_DB:-clubsphere_db}?schema=public}
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:6379}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://zarifzuhayer.tech}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://zarifzuhayer.tech}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-clubsphere_super_secret_production_key_2026}
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_DEFAULT_ORG_SLUG: ${NEXT_PUBLIC_DEFAULT_ORG_SLUG:-drmc-it-club}
    ports:
      - "${WEB_PORT:-3000}:3000"

  caddy:
    image: caddy:2-alpine
    container_name: clubsphere-caddy
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-zarifzuhayer.tech}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
