version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: clubsphere-postgres
    restart: always
    environment:
      POSTGRES_USER: clubsphere
      POSTGRES_PASSWORD: clubsphere_secure_password
      POSTGRES_DB: clubsphere_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clubsphere -d clubsphere_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: clubsphere-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clubsphere-web
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://clubsphere:clubsphere_secure_password@postgres:5432/clubsphere_db?schema=public"
      REDIS_URL: "redis://redis:6379"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "clubsphere_super_secret_production_key_2026"
      NODE_ENV: "production"
    ports:
      - "3000:3000"

  caddy:
    image: caddy:2-alpine
    container_name: clubsphere-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
