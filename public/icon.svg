<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Slate 950 base) -->
    <linearGradient id="bgBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#03050a"/>
    </linearGradient>

    <!-- Electric Violet Gradient for 'C' -->
    <linearGradient id="violetC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="45%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Crisp Platinum Gradient for 'S' -->
    <linearGradient id="silverS" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Subtle Border Stroke Gradient -->
    <linearGradient id="borderStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- High-contrast Badge Container -->
  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#bgBase)" stroke="url(#borderStroke)" stroke-width="16"/>

  <!-- Subtle Inner Tech Line -->
  <rect x="36" y="36" width="440" height="440" rx="100" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.2"/>

  <!-- 'C' - Electric Violet (x: 74 to 234, y: 152 to 360) -->
  <path d="M 234 176
           C 222 162, 200 152, 174 152
           C 116 152, 74 198, 74 256
           C 74 314, 116 360, 174 360
           C 200 360, 222 350, 234 336
           L 204 306
           C 196 314, 186 318, 174 318
           C 140 318, 118 290, 118 256
           C 118 222, 140 194, 174 194
           C 186 194, 196 198, 204 206
           Z"
        fill="url(#violetC)"/>

  <!-- 'S' - Crisp Platinum White (x: 254 to 438, y: 152 to 360) -->
  <path d="M 406 192
           C 392 166, 362 152, 326 152
           C 282 152, 254 176, 254 208
           C 254 246, 288 258, 330 268
           C 366 276, 384 288, 384 308
           C 384 330, 360 344, 326 344
           C 292 344, 268 330, 256 312
           L 226 336
           C 246 362, 280 380, 326 380
           C 384 380, 428 350, 428 306
           C 428 264, 390 250, 344 240
           C 310 232, 296 222, 296 206
           C 296 190, 312 180, 332 180
           C 354 180, 374 190, 386 204
           Z"
        transform="translate(10, -10)"
        fill="url(#silverS)"/>

  <!-- Apex Tech Pulse Dot -->
  <circle cx="436" cy="124" r="16" fill="#a855f7"/>
  <circle cx="436" cy="124" r="8" fill="#ffffff"/>
</svg>